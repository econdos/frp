name: Build e Assinar frpc.exe com Cosign

on:
  push:
    branches: [dev]

jobs:
  build-e-sign:
    name: Build e Assinatura
    runs-on: ubuntu-latest

    permissions:
      id-token: write  # 🔐 necessário para assinatura keyless
      contents: read

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v3

      - name: ⚙️ Instalar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'  # ajuste para a versão que você usa

      - name: 🔨 Build do frpc.exe (para Windows)
        run: |
          GOOS=windows GOARCH=amd64 go build -o frpc.exe ./cmd/frpc
        # ajuste o caminho ./cmd/frpc conforme o local do main.go do frpc

      - name: 🔧 Instalar Cosign
        uses: sigstore/cosign-installer@v3

      - name: 🔐 Assinar frpc.exe com Cosign
        run: |
          cosign sign-blob \
            --yes \
            --output-signature frpc.sig \
            --output-certificate frpc.crt \
            --bundle frpc.bundle \
            --new-bundle-format=true \
            frpc.exe

      - name: 📦 Publicar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: build-assinado-frpc
          path: |
            frpc.exe
            frpc.sig
            frpc.crt
            frpc.bundle

