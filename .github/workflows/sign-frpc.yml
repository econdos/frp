name: Build e Publicar Release do frpc.exe

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release (ex: v1.0.0)"
        required: true
      release_name:
        description: "Nome da release (ex: Release inicial)"
        required: true
      release_body:
        description: "Descrição da release"
        required: false

jobs:
  build-sign-release:
    runs-on: ubuntu-latest

    permissions:
      id-token: write         # 🔐 Para Cosign keyless
      contents: write         # 📝 Para criar releases e subir arquivos

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v3

      - name: ⚙️ Instalar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'  # ajuste conforme necessário

      - name: 🔨 Build frpc.exe para Windows
        run: |
          GOOS=windows GOARCH=amd64 go build -o frpc.exe ./cmd/frpc
        # ajuste o caminho se necessário

      - name: 🔧 Instalar Cosign
        uses: sigstore/cosign-installer@v3

      - name: 🔐 Assinar frpc.exe com Cosign
        run: |
          cosign sign-blob \
            --yes \
            --output-signature frpc.sig \
            --output-certificate frpc.crt \
            --bundle frpc.bundle \
            --new-bundle-format=true \
            frpc.exe

      - name: 📦 Criar e publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.release_name }}
          body: ${{ github.event.inputs.release_body }}
          files: |
            frpc.exe
            frpc.sig
            frpc.crt
            frpc.bundle

